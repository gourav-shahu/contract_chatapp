server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly
    location /_next/ { }

    # API proxy (optional) - disabled here. Configure on Azure or in nginx if needed
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    # }

    # All other requests - serve index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/xml;
}
