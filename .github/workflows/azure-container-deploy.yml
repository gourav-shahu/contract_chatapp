name: Build and Deploy to Azure Web App (ACR)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Container Registry - Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/contract-chat-backend:latest ./backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/contract-chat-backend:latest

      - name: Build and push frontend image
        run: |
          docker build --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} -t ${{ secrets.ACR_NAME }}.azurecr.io/contract-chat-frontend:latest ./frontend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/contract-chat-frontend:latest

      - name: Deploy to Azure Web App (multi-container)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./docker-compose.yml
